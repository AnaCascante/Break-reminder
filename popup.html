<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Break Reminder</title>
  <style>
    body {
      width: 220px;
      height: 180px;
      background: #222;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 16px;
    }
    #break-gif {
      display: none;
      margin-top: 10px;
      width: 120px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="status"></div>
  <img id="break-gif" src="assets/giphy.GIF" alt="Happy person dancing">
  <script>
    chrome.runtime.getBackgroundPage(function(bg) {
      const status = document.getElementById('status');
      const breakGif = document.getElementById('break-gif');
      if (bg.onBreak) {
        status.textContent = "Take a break! 20 seconds.";
        breakGif.style.display = "block";
      } else {
        let min = Math.floor(bg.timer / 60).toString().padStart(2, "0");
        let sec = (bg.timer % 60).toString().padStart(2, "0");
        status.textContent = "Next break in: " + min + ":" + sec;
        breakGif.style.display = "none";
      }
    });
  </script>
</body>
</html>
